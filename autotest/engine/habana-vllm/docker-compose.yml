version: "3.9"
services:
  vllm:
    #image: habana-vllm:latest
    image: vllm-fork-vllm
    runtime: habana
    privileged: true
    container_name: habana-vllm-for-autotest
    network_mode: host
    volumes:
      - /dev/accel:/dev/accel
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/weights:/weights
      - ./:/workspace
      - /tmp/traces:/mnt/traces
      - ./entrypoint_inner.sh:/entrypoint_inner.sh
    ipc: host
    environment:
      HABANA_VISIBLE_DEVICES: all
      HABANA_DEVICE: gaudi3
      DEVICE: gaudi3
      PT_HPU_LAZY_MODE: 0
      VLLM_TORCH_PROFILER_DIR: /mnt/traces/
      MODEL_PATH: ${MODEL_PATH}
      MODEL_NAME: ${MODEL_NAME}
      TP_SIZE: ${TP_SIZE}
      PORT: ${PORT}
      VLLM_SKIP_WARMUP: true
    ports:
      - "${PORT}:${PORT}"
    entrypoint: bash
    command: /entrypoint_inner.sh
    # command: -c "sleep infinity"
