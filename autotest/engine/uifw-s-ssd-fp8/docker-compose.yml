version: "3.9"
services:
  uifw-s-ssd-fp8:
    image: nctu6/uifw-one:air520
    container_name: uifw-s-ssd-fp8-for-autotest
    volumes:
      - /home/unieai2:/root
      - /mnt/nvme0:/mnt/nvme0
      - /sys:/sys:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/unieai:/etc/unieai
      - ${MODEL_PATH:-/home/unieai2/weights}:/weights
      - ./entrypoint_inner.sh:/entrypoint_inner.sh
    runtime: nvidia
    cap_add:
      - SYS_ADMIN
    network_mode: host
    environment:
      NCCL_DEBUG: INFO
      MODEL_PATH: ${MODEL_PATH:-/home/unieai2/weights}
      MODEL_OWNER: ${MODEL_OWNER:-Qwen}
      MODEL_NAME: ${MODEL_NAME:-Qwen3-0.6B}
      TP_SIZE: ${TP_SIZE:-1}
      PORT: ${PORT:-8999}
    ports:
      - "${PORT:-8999}:${PORT:-8999}"
    shm_size: 256gb
    entrypoint: bash
    # command: -c "sleep infinity"
    command: /entrypoint_inner.sh