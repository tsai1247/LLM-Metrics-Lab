version: "3.9"
services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-for-autotest
    runtime: nvidia
    shm_size: 256g
    volumes:
      - ${MODEL_PATH:-/weights}:/weights
      - ./entrypoint.sh:/entrypoint.sh
    environment:
      ENGINE: ${ENGINE}
      MODEL_PATH: ${MODEL_PATH:-/weights}
      MODEL_OWNER: ${MODEL_OWNER:-Qwen}
      MODEL_NAME: ${MODEL_NAME:-Qwen3-0.6B}
      TP_SIZE: ${TP_SIZE:-1}
      PORT: ${PORT:-8999}
    entrypoint: bash
    command: /entrypoint.sh
    ports:
      - "${PORT:-8999}:${PORT:-8999}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${TP_SIZE:-1}
              capabilities: [gpu]
